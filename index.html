<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GeziYorum</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeziYorum">
<meta name="theme-color" content="#1f3a4d">
<style>
:root{--bg:#f4f1ea;--fg:#1d2a33;--mut:#5f6b73;--ac:#1f3a4d;--card:#fff;--bd:#d9d3c5;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141b20;--fg:#e8e4da;--mut:#9aa5ab;--ac:#8fb8d0;--card:#1c262d;--bd:#2f3d46;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{width:100%;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 22px;text-align:center}
h1{margin:0 0 4px;font-size:1.4rem;color:var(--ac)}
p{margin:0 0 18px;color:var(--mut);font-size:.92rem}
input{width:100%;font:inherit;font-size:1.3rem;letter-spacing:.3em;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.4em;margin-top:12px;font-size:.9rem;color:var(--err)}
#ipucu{margin-top:8px;font-size:.9rem;color:var(--mut)}
</style></head><body>
<main id="kapi">
  <h1>GeziYorum</h1>
  <p>Bu rehber özeldir. Devam etmek için şifreyi gir.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" aria-label="Şifre" autofocus>
    <button id="b" type="submit">Aç</button>
  </form>
  <div id="msg" role="alert"></div>
  <div id="ipucu" hidden>İpucu: ilk altı rakam</div>
</main>
<script>
(function(){
  var ITER=300000, KEY='gy_k1';
  var $=function(i){return document.getElementById(i)};
  if(location.hash==='#ipucu') $('ipucu').hidden=false;
  if('serviceWorker' in navigator && location.protocol==='https:'){
    try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
  }
  function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function unb64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  function getBlob(){return fetch('gezi.enc',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('ag');return r.arrayBuffer()}).then(function(b){return new Uint8Array(b)})}
  function deriveRaw(pw,salt){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
      .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},k,256)})
      .then(function(b){return new Uint8Array(b)});
  }
  function decrypt(raw,blob){
    return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(16,28)},k,blob.slice(28));
    });
  }
  function toText(pt){return new TextDecoder('utf-8').decode(pt)}
  function open(html){
    if(location.hash==='#ipucu')history.replaceState(null,'',location.pathname);
    document.open();document.write(html);document.close();
  }
  function fail(m){$('msg').textContent=m;$('b').disabled=false;$('pw').disabled=false;$('pw').focus()}
  // Kayıtlı anahtar varsa şifre sormadan aç (çevrimdışı da çalışır).
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){
    getBlob().then(function(blob){return decrypt(unb64(saved),blob)}).then(function(pt){open(toText(pt))})
      .catch(function(){try{localStorage.removeItem(KEY)}catch(e){}});
  }
  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    var pw=$('pw').value.trim();if(!pw)return;
    $('msg').textContent='';$('b').disabled=true;$('pw').disabled=true;
    getBlob().then(function(blob){
      return deriveRaw(pw,blob.slice(0,16)).then(function(raw){
        return decrypt(raw,blob).then(function(pt){
          try{localStorage.setItem(KEY,b64(raw))}catch(e){}
          try{open(toText(pt))}catch(err){fail('Açılamadı: '+err.message)}
        },function(){fail('Şifre yanlış.')});
      });
    }).catch(function(err){fail('Hata: '+(err&&err.message||err))});
  });
})();
</script>
</body></html>
